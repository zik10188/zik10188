<svg xmlns="http://www.w3.org/2000/svg" width="760" height="72" viewBox="0 0 760 72" role="img" aria-labelledby="title desc">
  <title id="title">Typing animation</title>
  <desc id="desc">Turning coffee into broken code. Building things, breaking limits.</desc>
  <style>
    .text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0;
    }
    .text-line-1 {
      fill: url(#gradient-line-1);
    }
    .text-line-2 {
      fill: url(#gradient-line-2);
    }
    .cursor {
      animation: blink 0.8s step-end infinite;
    }
    .cursor-1 {
      fill: #ffb86b;
    }
    .cursor-2 {
      fill: #58a6ff;
    }
    .clip-line-1 {
      animation: type-line-1 7.6s steps(40, end) infinite;
    }
    .clip-line-2 {
      animation: type-line-2 7.6s steps(40, end) infinite;
    }
    .cursor-track-1 {
      animation:
        move-cursor-1 7.6s steps(40, end) infinite,
        show-cursor-1 7.6s linear infinite;
    }
    .cursor-track-2 {
      animation:
        move-cursor-2 7.6s steps(40, end) infinite,
        show-cursor-2 7.6s linear infinite;
    }
    @keyframes type-line-1 {
      0% { width: 0; }
      31.58%, 42.11% { width: 650px; }
      46.05%, 100% { width: 0; }
    }
    @keyframes type-line-2 {
      0%, 46.05% { width: 0; }
      77.63%, 88.16% { width: 650px; }
      92.11%, 100% { width: 0; }
    }
    @keyframes move-cursor-1 {
      0% { transform: translateX(0); }
      31.58%, 100% { transform: translateX(650px); }
    }
    @keyframes move-cursor-2 {
      0%, 46.05% { transform: translateX(0); }
      77.63%, 100% { transform: translateX(650px); }
    }
    @keyframes show-cursor-1 {
      0%, 46.04% { opacity: 1; }
      46.05%, 100% { opacity: 0; }
    }
    @keyframes show-cursor-2 {
      0%, 46.04% { opacity: 0; }
      46.05%, 92.1% { opacity: 1; }
      92.11%, 100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="clip-line-1" clipPathUnits="userSpaceOnUse">
      <rect class="clip-line-1" x="30" y="18" width="0" height="36" />
    </clipPath>
    <clipPath id="clip-line-2" clipPathUnits="userSpaceOnUse">
      <rect class="clip-line-2" x="30" y="18" width="0" height="36" />
    </clipPath>
    <linearGradient id="gradient-line-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd18a" />
      <stop offset="1" stop-color="#f0883e" />
    </linearGradient>
    <linearGradient id="gradient-line-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" />
      <stop offset="1" stop-color="#39d2c0" />
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-line-1)">
    <text class="text text-line-1" x="30" y="48" textLength="650" lengthAdjust="spacingAndGlyphs">Turning coffee into broken code</text>
  </g>
  <g clip-path="url(#clip-line-2)">
    <text class="text text-line-2" x="30" y="48" textLength="650" lengthAdjust="spacingAndGlyphs">Building things, breaking limits</text>
  </g>
  <g class="cursor-track-1">
    <rect class="cursor cursor-1" x="30" y="22" width="3" height="30" rx="1" />
  </g>
  <g class="cursor-track-2">
    <rect class="cursor cursor-2" x="30" y="22" width="3" height="30" rx="1" />
  </g>
</svg>
